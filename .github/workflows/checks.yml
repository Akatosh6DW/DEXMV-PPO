name: Developer checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-and-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/mpl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: environment/*.txt
      - run: bash scripts/bootstrap_developer.sh
      - run: python -m unittest discover -s scripts -p 'test_s12_*.py'
